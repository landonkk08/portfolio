<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1220">
  <title>File not found</title>
  <script>
    // GitHub Pages shows this page at whatever missing address was visited
    // (e.g. /portfolio/some/old/page), so point every relative link at the
    // site's root. Change "/portfolio/" if you rename the repository.
    (function () {
      var repo = "/portfolio/";
      var base = document.createElement("base");
      base.href = location.pathname.indexOf(repo) === 0 ? repo : "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/settings.js"></script>
</head>
<body class="os">
  <main class="error-screen">
    <canvas id="wallpaper" class="wallpaper" aria-hidden="true"></canvas>

    <section class="error-dialog" role="alertdialog" aria-labelledby="errTitle" aria-describedby="errDesc">
      <header class="error-bar">
        <span class="os-mark" aria-hidden="true"></span>
        <span>System error</span>
      </header>
      <div class="error-body">
        <div class="error-head">
          <span class="error-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 16.5h.01" stroke-width="3"/><circle cx="12" cy="12" r="9.5"/></svg>
          </span>
          <div>
            <p class="eyebrow">Error 404</p>
            <h1 class="win-h" id="errTitle">File not found</h1>
          </div>
        </div>
        <p class="lead" id="errDesc">The page you're looking for doesn't exist or has moved.</p>
        <code class="error-path"><span>Path</span><span id="errPath"></span></code>
        <div class="actions">
          <a class="btn primary" href="./" autofocus>Return to desktop</a>
          <a class="btn" href="plain.html">Plain view</a>
        </div>
        <p class="error-foot"><a href="privacy.html">Privacy policy</a></p>
      </div>
    </section>
  </main>

  <script src="js/wallpaper.js"></script>
  <script>document.getElementById("errPath").textContent = location.pathname;</script>
</body>
</html>
